# mise configuration for NetPulse (GNOME Shell 45+ extension)
#
# Expected OS-native Fedora packages (not managed by mise):
#   - glib2 / glib2-devel  (provides `glib-compile-schemas`)
#   - libxml2              (provides `xmllint`)
#   - gjs                  (GNOME JavaScript runtime)
#   - zip                  (packaging extension archives)
#   - gnome-shell          (runtime host for the extension)

[env]
UUID = "netpulse@diagnostics.local"
SCHEMA_DIR = "schemas"

[tools]
node = "lts"
jq = "latest"
pre-commit = "latest"
python = "latest"

[tasks.compile-schemas]
description = "Compile GSettings XML schemas"
run = 'glib-compile-schemas "$SCHEMA_DIR/"'

[tasks.install]
description = "Symlink extension into local GNOME Shell extensions directory"
depends = ["compile-schemas"]
run = '''
set -euo pipefail
INSTALL_DIR="$HOME/.local/share/gnome-shell/extensions/$UUID"
mkdir -p "$(dirname "$INSTALL_DIR")"
ln -sfn "$PWD" "$INSTALL_DIR"
echo "Installed extension symlink: $INSTALL_DIR -> $PWD"
'''

[tasks.enable]
description = "Enable the extension in GNOME Shell"
run = '''
set -euo pipefail
if ! gnome-extensions enable "$UUID"; then
  echo "Failed to enable $UUID in GNOME Shell." >&2
  echo "Hint: On Wayland, GNOME Shell does not automatically discover newly installed extensions." >&2
  echo "Try logging out and back in, or test in a nested Wayland session (e.g. 'dbus-run-session -- gnome-shell --nested --wayland')." >&2
  exit 1
fi
'''

[tasks.disable]
description = "Disable the extension in GNOME Shell"
run = 'gnome-extensions disable "$UUID"'

[tasks.install-enable]
description = "Install (symlink) and enable the extension in GNOME Shell"
depends = ["install"]
run = '''
set -euo pipefail
if ! gnome-extensions enable "$UUID"; then
  echo "Failed to enable $UUID in GNOME Shell." >&2
  echo "Hint: On Wayland, GNOME Shell does not automatically discover newly installed extensions." >&2
  echo "Try logging out and back in, or test in a nested Wayland session (e.g. 'dbus-run-session -- gnome-shell --nested --wayland')." >&2
  exit 1
fi
'''

[tasks.uninstall]
description = "Remove extension from local GNOME Shell extensions directory"
run = '''
set -euo pipefail
gnome-extensions disable "$UUID" 2>/dev/null || true
rm -rf "$HOME/.local/share/gnome-shell/extensions/$UUID"
echo "Uninstalled extension $UUID"
'''

[tasks.pack]
description = "Build distributable GNOME Shell extension zip archive for extensions.gnome.org"
run = '''
set -euo pipefail
ZIP_NAME="${UUID}.shell-extension.zip"
rm -f "$ZIP_NAME"
gnome-extensions pack \
  --extra-source=diagnostics.js \
  --extra-source=logger.js \
  --schema="$SCHEMA_DIR/org.gnome.shell.extensions.netpulse.gschema.xml" \
  --force
'''

[tasks.lint-json]
description = "Validate metadata.json"
run = "jq empty metadata.json"

[tasks.lint-xml]
description = "Validate GSettings XML schemas with xmllint and glib-compile-schemas"
run = '''
set -euo pipefail
xmllint --noout "$SCHEMA_DIR"/*.gschema.xml
glib-compile-schemas --strict --dry-run "$SCHEMA_DIR/"
'''

[tasks.lint-js]
description = "Check JS syntax and guard against legacy GNOME 44 ExtensionUtils usage"
run = '''
set -euo pipefail
for f in extension.js diagnostics.js logger.js prefs.js; do
  node --check "$f"
done
if grep -En 'imports\.misc\.extensionUtils|ExtensionUtils\.getCurrentExtension' extension.js diagnostics.js logger.js prefs.js; then
  echo "ERROR: Legacy GNOME 44 ExtensionUtils usage detected" >&2
  exit 1
fi
'''

[tasks.check]
alias = "lint"
description = "Run all JSON, XML, and JS lint checks"
depends = ["lint-json", "lint-xml", "lint-js"]

[tasks.clean]
description = "Remove compiled schemas and packaged extension archives"
run = 'rm -f "$SCHEMA_DIR/gschemas.compiled" *.shell-extension.zip'

[tasks.hooks]
description = "Install pre-commit git hooks"
run = "pre-commit install"
